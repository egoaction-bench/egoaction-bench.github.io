name: Deploy project page

# Initial public deployment authorized by the owner on 2026-10-25.
# Future website changes deploy when deliberately pushed to main.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      confirm_media_release:
        description: "Confirm that the included teaser and EPIC-KITCHENS demo excerpt are approved for public release."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: (github.event_name == 'push' || inputs.confirm_media_release) && github.repository == 'egoaction-bench/egoaction-bench.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate the site
        run: node --test tests/*.test.mjs
      - name: Wait for any branch-based Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          // A newly created organization site can auto-enable a legacy build
          // of main. Let it finish before publishing the site-only artifact.
          const base = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}`;
          const headers = {
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            Accept: "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
          };
          const settings = await fetch(`${base}/pages`, { headers });
          if (!settings.ok) throw new Error(`Read Pages settings: HTTP ${settings.status}`);
          if ((await settings.json()).build_type === "workflow") process.exit(0);
          let completed = false;
          for (let attempt = 0; attempt < 30; attempt++) {
            const response = await fetch(`${base}/actions/runs?head_sha=${process.env.GITHUB_SHA}&per_page=100`, { headers });
            if (!response.ok) throw new Error(`Read build status: HTTP ${response.status}`);
            const data = await response.json();
            const legacy = data.workflow_runs.filter(run => run.name === "pages build and deployment");
            if (legacy.length && legacy.every(run => run.status === "completed")) {
              completed = true;
              break;
            }
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          if (!completed) throw new Error("Branch-based Pages build did not finish; refusing a racing deployment.");
          console.log("Branch build finished; publishing only site/.");
          JS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
